<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Chat AI Model</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home Screen -->
  <div id="homeScreen" class="screen">
    <h1>Simple Chat AI Generator</h1>
    <p>Enter your query to generate AI content:</p>
    <input type="text" id="queryInput" placeholder="Enter your simple query...">
    <button id="generateButton">Generate AI Content</button>
  </div>
  
  <!-- Response Screen -->
  <div id="responseScreen" class="screen" style="display: none;">
    <h1>AI Generated Response</h1>
    <div id="responseBox"></div>
    <button id="backButton">Go Back</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
